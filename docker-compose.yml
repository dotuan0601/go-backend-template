version: "3.9"

services:

  mysql:
    image: mysql:8.4
    container_name: go-backend-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: go_backend_template

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    container_name: go-backend-adminer

    restart: unless-stopped

    ports:
      - "8081:8080"

    depends_on:
      mysql:
        condition: service_healthy
  redis:
    image: redis:7.4
    container_name: go-backend-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
